
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Credenciamento Distrital 2026</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #f1f5f9;
      color: #17243b;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 480px;
      margin: 25px auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      color: #102b55;
      font-size: 27px;
      margin: 0 0 10px;
    }

    .sub {
      color: #64748b;
      line-height: 1.6;
      font-size: 14px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px #00000010;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 12px 0 10px;
    }

    input {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
    }

    #codigo, #usuarioLogin {
      text-transform: uppercase;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 0;
      border-radius: 9px;
      background: #164c96;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .secondary { background: #334155; }
    .success { background: #167347; }
    .hidden { display: none !important; }

    .name {
      font-size: 24px;
      font-weight: bold;
    }

    .info {
      margin: 14px 0;
      font-size: 16px;
    }

    .message {
      padding: 14px;
      border-radius: 9px;
      margin-top: 12px;
      line-height: 1.5;
    }

    .ok {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
      overflow: hidden;
      border-radius: 12px;
    }

    #reader video {
      width: 100% !important;
    }

    footer {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>
<main>

  <!-- TELA DE LOGIN -->
  <section class="card" id="telaLogin">
    <header>
      <h1>Acesso ao Credenciamento</h1>
      <div class="sub">
        Conferência Distrital de Pastores e Líderes
      </div>
      <div class="sub">Distrito Minas Gerais</div>
    </header>

    <form id="formLogin">
      <label for="usuarioLogin">Usuário</label>
      <input
        id="usuarioLogin"
        type="text"
        placeholder="Usuário"
        autocomplete="username"
        required
      >

      <label for="senhaLogin">Senha</label>
      <input
        id="senhaLogin"
        type="password"
        placeholder="Digite sua senha"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="botaoLogin">
        Entrar
      </button>
    </form>

    <div id="mensagemLogin"></div>
  </section>

  <!-- ÁREA PROTEGIDA -->
  <div id="areaCredenciamento" class="hidden">

    <header>
      <h1>Credenciamento 2026</h1>
      <div class="sub">
        Conferência Distrital de Pastores e Líderes
      </div>
      <div class="sub">Distrito Minas Gerais</div>
    </header>

    <section class="card">
      <label for="codigo">Código do ingresso</label>

      <input
        id="codigo"
        placeholder="CDPL26-0001"
        autocomplete="off"
      >

      <button id="buscar" onclick="consultar()">
        Consultar ingresso
      </button>

      <button
        id="scan"
        class="secondary"
        onclick="alternarCamera()"
      >
        Ler QR Code
      </button>

      <div id="reader" class="hidden"></div>
      <div id="aviso"></div>
    </section>

    <section class="card hidden" id="resultado">
      <div class="name" id="nome"></div>
      <div class="info" id="ingresso"></div>
      <div class="info" id="pagamento"></div>
      <div class="info" id="entrada"></div>

      <button
        id="confirmar"
        class="success"
        onclick="confirmar()"
      >
        Confirmar entrada
      </button>
    </section>

    <button class="secondary" onclick="sair()">
      Sair do sistema
    </button>

  </div>

  <footer>
    Igreja do Nazareno — Distrito Minas Gerais
  </footer>

</main>

<script>
  const API_URL =
    "https://script.google.com/macros/s/AKfycbwOoSoFT7Nw6VPhthrhFdY29a_5xjh5PVIl2aPKy-nq92estOjDk_JkEQSyiWOLFydx/exec";

  let tokenSessao =
    sessionStorage.getItem('tokenRecepcao') || '';

  let participante = null;
  let leitorQR = null;
  let iniciandoCamera = false;
  let processandoQR = false;
  let operacaoPendente = false;

  const el = id => document.getElementById(id);

  function mostrarMensagem(id, texto, erro = false) {
    const destino = el(id);
    destino.replaceChildren();

    if (!texto) return;

    const div = document.createElement('div');
    div.className = 'message ' + (erro ? 'error' : 'ok');
    div.textContent = texto;
    destino.appendChild(div);
  }

  function aviso(texto, erro = false) {
    mostrarMensagem('aviso', texto, erro);
  }

  function mostrarCredenciamento() {
    el('telaLogin').classList.add('hidden');
    el('areaCredenciamento').classList.remove('hidden');
  }

  function mostrarLogin() {
    el('areaCredenciamento').classList.add('hidden');
    el('telaLogin').classList.remove('hidden');
    el('resultado').classList.add('hidden');
    participante = null;
  }

  function limparSessao() {
    tokenSessao = '';
    sessionStorage.removeItem('tokenRecepcao');
    pararCamera();
    mostrarLogin();
  }

  function ocupado(valor) {
    operacaoPendente = valor;
    el('buscar').disabled = valor;
    el('confirmar').disabled = valor;
  }

  async function requisicao(acao, codigo = '', credenciais = {}) {
    if (!API_URL) {
      throw new Error('Endereço do servidor não configurado.');
    }

    const pedido = {
      acao,
      codigo,
      token: tokenSessao,
      ...credenciais
    };

    const resposta = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify(pedido)
    });

    if (!resposta.ok) {
      throw new Error('Falha de comunicação com o servidor.');
    }

    const dados = await resposta.json();

    if (dados.sessaoExpirada) {
      limparSessao();
    }

    return dados;
  }

  // LOGIN
  async function fazerLogin(event) {
    event.preventDefault();

    const usuario = el('usuarioLogin').value.trim();
    const senha = el('senhaLogin').value;

    const botao = el('botaoLogin');
    botao.disabled = true;

    mostrarMensagem(
      'mensagemLogin',
      'Verificando acesso...'
    );

    try {
      const dados = await requisicao(
        'login',
        '',
        { usuario, senha }
      );

      if (dados.erro) {
        mostrarMensagem(
          'mensagemLogin',
          dados.erro,
          true
        );
        return;
      }

      if (!dados.sucesso || !dados.token) {
        throw new Error('Resposta de login inválida.');
      }

      tokenSessao = dados.token;

      sessionStorage.setItem(
        'tokenRecepcao',
        tokenSessao
      );

      el('senhaLogin').value = '';
      mostrarMensagem('mensagemLogin', '');
      mostrarCredenciamento();

    } catch (erro) {
      mostrarMensagem(
        'mensagemLogin',
        'Falha no login: ' + erro.message,
        true
      );
    } finally {
      botao.disabled = false;
    }
  }

  function sair() {
    limparSessao();
    el('senhaLogin').value = '';
    aviso('');
  }

  // CONSULTA
  async function consultar() {
    if (operacaoPendente || !tokenSessao) return;

    const codigo = el('codigo').value
      .trim()
      .toUpperCase();

    await pararCamera();

    participante = null;
    el('resultado').classList.add('hidden');

    if (!codigo) {
      aviso('Informe o código do ingresso.', true);
      return;
    }

    ocupado(true);
    aviso('Consultando ingresso...');

    try {
      const dados = await requisicao(
        'consultar',
        codigo
      );

      if (dados.erro) {
        aviso(dados.erro, true);
        return;
      }

      participante = dados;

      el('nome').textContent = dados.nome;

      el('ingresso').textContent =
        'Ingresso: ' + dados.codigo;

      el('pagamento').textContent =
        'Pagamento: ' + dados.pagamento;

      const entrada =
        String(dados.entrada || '')
          .trim()
          .toLowerCase() === 'sim';

      const pago =
        String(dados.pagamento || '')
          .trim()
          .toLowerCase() === 'confirmado';

      el('entrada').textContent = entrada
        ? 'Entrada já registrada: ' + (dados.horario || '')
        : 'Entrada ainda não registrada';

      el('confirmar').disabled = entrada || !pago;
      el('resultado').classList.remove('hidden');

      aviso('');

    } catch (erro) {
      aviso('Falha na consulta: ' + erro.message, true);

    } finally {
      ocupado(false);

      if (participante) {
        const entrada =
          String(participante.entrada || '')
            .toLowerCase() === 'sim';

        const pago =
          String(participante.pagamento || '')
            .toLowerCase() === 'confirmado';

        el('confirmar').disabled = entrada || !pago;
      }
    }
  }

  // CONFIRMAÇÃO
  async function confirmar() {
    if (!participante || operacaoPendente || !tokenSessao) {
      return;
    }

    ocupado(true);
    aviso('Registrando entrada...');

    try {
      const resposta = await requisicao(
        'confirmar',
        participante.codigo
      );

      if (resposta.erro) {
        aviso(resposta.erro, true);
        el('confirmar').disabled = true;
        return;
      }

      participante.entrada = 'Sim';

      el('entrada').textContent = 'Entrada confirmada';
      el('confirmar').disabled = true;

      aviso(
        'Entrada confirmada! Bem-vindo(a), ' +
        resposta.nome
      );

    } catch (erro) {
      aviso(
        'Falha ao registrar: ' + erro.message +
        '. Consulte novamente antes de tentar outra vez.',
        true
      );

      el('confirmar').disabled = true;

    } finally {
      ocupado(false);

      if (participante) {
        const entrada =
          String(participante.entrada || '')
            .toLowerCase() === 'sim';

        if (entrada) {
          el('confirmar').disabled = true;
        }
      }
    }
  }

  // CÂMERA E QR CODE
  async function alternarCamera() {
    if (iniciandoCamera || operacaoPendente) return;

    if (leitorQR) {
      await pararCamera();
      return;
    }

    if (typeof Html5Qrcode === 'undefined') {
      aviso('Biblioteca de QR Code não carregada.', true);
      return;
    }

    if (!navigator.mediaDevices?.getUserMedia) {
      aviso(
        'Este navegador não disponibilizou acesso à câmera.',
        true
      );
      return;
    }

    iniciandoCamera = true;
    processandoQR = false;
    el('scan').disabled = true;
    el('reader').classList.remove('hidden');

    try {
      leitorQR = new Html5Qrcode('reader');

      await leitorQR.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: 220 },

        async codigoLido => {
          if (processandoQR) return;

          processandoQR = true;

          el('codigo').value =
            String(codigoLido || '')
              .trim()
              .toUpperCase();

          await pararCamera();
          await consultar();
        },

        () => {}
      );

      el('scan').textContent = 'Fechar câmera';
      aviso('');

    } catch (erro) {
      await pararCamera();

      aviso(
        'Não foi possível iniciar a câmera: ' +
        (erro.message || erro),
        true
      );

    } finally {
      iniciandoCamera = false;
      el('scan').disabled = false;
    }
  }

  async function pararCamera() {
    const leitor = leitorQR;
    leitorQR = null;

    if (leitor) {
      try {
        if (leitor.isScanning) {
          await leitor.stop();
        }

        leitor.clear();

      } catch (erro) {
        console.error('Erro ao fechar câmera:', erro);
      }
    }

    el('reader').classList.add('hidden');
    el('scan').textContent = 'Ler QR Code';
  }

  // EVENTOS
  el('formLogin').addEventListener('submit', fazerLogin);

  el('codigo').addEventListener('keydown', event => {
    if (event.key === 'Enter') {
      consultar();
    }
  });

  // Sessões existentes precisam ser verificadas
  // no servidor antes de liberar o credenciamento.
  if (tokenSessao) {
    (async () => {
      try {
        const dados = await requisicao('verificarSessao');

        if (dados.sucesso === true) {
          mostrarCredenciamento();
        } else {
          limparSessao();
        }
      } catch (erro) {
        limparSessao();
      }
    })();
  }
</script>

</body>
</html>
